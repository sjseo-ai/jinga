# 배포:  npx wrangler deploy --config workers/jinga-policy-proxy/wrangler.toml
name = "jinga-policy-proxy"
account_id = "79548fed0e1b787693d6b6d6dee56f2a"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 방문자가 없어도 매시간 뉴스를 조회해 "마지막 성공값"을 갱신합니다.
[triggers]
crons = ["7 * * * *"]

# (권장) 마지막 성공값을 전 엣지에서 공유하려면 KV 연결 — jinga-korea-macro 와 같은 네임스페이스를 써도 됩니다.
# [[kv_namespaces]]
# binding = "JINGA_KV"
# id = "<npx wrangler kv namespace create JINGA_KV 출력 id>"

# ⚠️ API 키는 이 파일에 절대 쓰지 마세요. 아래 명령으로 등록합니다(값은 프롬프트로 입력):
#   npx wrangler secret put <KEY_NAME> --config workers/jinga-policy-proxy/wrangler.toml
